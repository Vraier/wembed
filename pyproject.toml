[build-system]
requires = ["scikit-build-core"]
build-backend = "scikit_build_core.build"

[project]
name = "wembed"
version = "0.2.0"
authors = [
  { name = "Jean-Pierre von der Heydt", email = "heydt@kit.edu" },
  { name = "Nikolai Maas", email = "nikolai.maas@kit.edu" },
]
description="WEmbed python bindings to calculate weighted node embeddings"
readme = "README.md"
license.file = "LICENSE"
requires-python = ">=3.9"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
]

[tool.scikit-build]
minimum-version = "0.10"
wheel.license-files = ["LICENSE"]
cmake.build-type = "Release"
build.targets = ["wembed_python"]
install.components = ["python"]

[tool.scikit-build.cmake.define]
WEMBED_BUILD_PYTHON = "ON"
WEMBED_BUILD_TOOLS = "OFF"

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*i686* *musllinux*"
test-command = "python {project}/python/examples/cli_example.py -i {project}/assets/small_graph.edg"
linux.before-all = """
yum update -y && yum install -y git cmake python3-devel &&
curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain stable
"""
linux.environment = {PATH = "$HOME/.cargo/bin:$PATH"}
