name: Test, build wheels and upload to PyPI

on: [push, pull_request]

jobs:
  tests:
    name: C++ tests (sprk ${{ matrix.sprk }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sprk: ["ON", "OFF"]
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset release -DWEMBED_USE_SPRK=${{ matrix.sprk }} -DWEMBED_BUILD_PYTHON=OFF

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release

  build_wheels:
    name: Build wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build sdist
        run: pipx run build --sdist

      - name: Check metadata
        run: pipx run twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_test_pypi:
    name: Upload To test PyPi
    needs: [tests, build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # pull requests (from forks) have no access to the token
    if: github.event_name == 'push'
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          verbose: true

  upload_pypi:
    name: Upload To PyPi
    needs: [tests, build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          verbose: true
